<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4thG33x Course Index</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: #f8fafc;
            color: #1a252f;
        }
        .index-header {
            background-color: #005480;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }
        .index-header h1 {
            margin: 0;
            font-size: 2.5rem;
        }
        .index-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .course-section {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            padding: 24px;
            margin-bottom: 30px;
            border-top: 4px solid #53534a;
        }
        .course-section h2 {
            margin-top: 0;
            color: #005480;
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }
        .lesson-link {
            display: block;
            padding: 12px 16px;
            margin: 8px 0;
            background-color: #f8fafc;
            color: #1a252f;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            border-left: 4px solid orange;
            transition: all 0.2s ease;
        }
        .lesson-link:hover {
            background-color: #005480;
            color: white;
            border-left-color: black;
            transform: translateX(4px);
        }
    </style>
</head>
<body>

    <header class="index-header">
        <h1>M4thG33x Mathematics Directory</h1>
    </header>

    <main class="index-container" id="course-index-container">
        <!-- Dynamic course blocks and links auto-render here via JavaScript -->
    </main>

    <!-- Connect directly to your core master site navigation file -->
    <script src="scripts.js"></script>
</body>
</html>
