<!DOCTYPE html>
<html dir="ltr" lang="en-us">

<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="author" content="J Bowers">

    <!--Viewport scaling-->
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!--Awesome Fonts link-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!--Custom CSS files-->
    <link rel="stylesheet" type="text/css" media="screen" href="../course-styles.css">
    <link rel="stylesheet" type="text/css" media="print" href="../print-styles.css">

    <!--MathJax links-->
    <script src="../site-math.js"></script>
    <script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>

    <link rel="icon" type="image/png" href="../logo-s.png">
</head>

<body id="mainbody">
    <!-- Print Button: only visible on the printer friendly page -->
    <div id="printbutton">
        <button type="button" onclick="loadprint()">Print Page</button>
    </div>

    <!-- EMPTY PLACEHOLDER HEADER: Script will automatically inject the logo and subtitle -->
    <header class="page-header" id="global-site-header" role="banner"></header>

    <!-- Insert this uniform element block across all root, overview, and lesson files -->
    <div class="topnavmenu" id="mytopnavmenu">
        <!-- Links are automatically populated here via the site-nav.js script -->
    </div>

    <!-- Main content area shell container is a semantic <main> tag -->
    <main class="lesson-body" id="main-content">
        <!-- On This Page Menu -->
        <nav class="lesson-page-toc" aria-label="On this Page Section Navigation Links">
            <button class="dropbtn">On this Page</button>
            <div class="dropdown-content">
                <ul>
                    <li><a id="toc-top" href="#top"><!--Filled by page name from script--></a></li>
                    <!-- <li><a href="#operations">...</a></li> -->
                </ul>
            </div>
        </nav>

        <!-- The main core lesson header is a native semantic <h1> tag -->
        <h1 id="top"><!--Filled by page name from script--></h1>

        <div class="objective-region" role="region" aria-label="Lesson Objectives">
            <!-- Content goes here. -->
            <p>On this page, you will learn to:</p>
            <ul>
                <li>...</li>
            </ul>
        </div>


    </main>
    <!-- End of the main content -->

    <!-- EMPTY PLACEHOLDER FOOTER: Script will automatically inject the copyright blocks -->
    <footer class="lesson-footer" id="global-site-footer" role="contentinfo"></footer>

    <!--Custom scripts-->
    <script src="../site-nav.js" defer></script>
    <script src="../site-ui.js" defer></script>
    <script src="../site-quizlets.js" defer></script>
</body>

</html>
